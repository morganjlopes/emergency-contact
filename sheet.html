<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Fridge Sheet | Emergency Contact by SupportNow</title>
<meta name="description" content="One printable sheet, one row per kid, each with a QR code to the full picture.">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<link href="assets/ec.css" rel="stylesheet">

<style>
.sheet-shell{max-width:900px; margin:0 auto; padding:36px 20px 80px}
.toolbar{display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; margin-bottom:24px}
.toolbar .tip{font-size:13.5px; color:var(--secondary); font-weight:600; max-width:420px}

.sheet{max-width:8.5in; margin:0 auto; padding:0.55in 0.6in 0.4in; print-color-adjust:exact; -webkit-print-color-adjust:exact}
.sheet-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; border-bottom:3px solid var(--ink); padding-bottom:10px}
.sheet-title{font-size:21px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--ink); display:flex; align-items:center; gap:10px}
.sheet-title i{color:var(--rose)}
.sheet-fam{font-size:16px; font-weight:800; color:var(--ink)}

.sheet .call-band{margin-top:12px; font-size:13.5px; padding:11px 15px}
.sheet .call-band .big{font-size:15px}

.grown-ups{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:6px 18px; padding:11px 2px 13px; border-bottom:1.5px solid var(--border); font-size:13px}
.grown-ups .who b{display:block; font-size:13.5px; color:var(--ink)}
.grown-ups .who span{color:var(--secondary); font-size:12px}
.grown-ups .who .num{color:var(--ink); font-weight:700; font-size:13.5px}

.kid-row{display:grid; grid-template-columns:1.35in 1fr 1.05in; gap:0 16px; align-items:center; padding:13px 2px; border-bottom:1.5px solid var(--border); break-inside:avoid}
.kid-row:last-of-type{border-bottom:0}
.kid-name b{font-size:18px; color:var(--ink); letter-spacing:-.01em; display:block; line-height:1.2}
.kid-name span{font-size:12px; color:var(--secondary); font-weight:600}
.kid-facts{font-size:12.5px; color:var(--body); min-width:0}
.kid-facts .line{margin-top:3px}
.kid-facts .line:first-child{margin-top:0}
.kid-facts .lbl{font-weight:800; color:var(--ink); font-size:11px; text-transform:uppercase; letter-spacing:.05em; margin-right:5px}
.kid-facts .chips{display:flex; flex-wrap:wrap; gap:4px; margin-bottom:4px}
.kid-qr{text-align:center}
.kid-qr .qr-box{width:0.95in; height:0.95in; margin:0 auto; padding:3px; border:1.5px solid var(--ink); border-radius:8px; background:#fff}
.kid-qr small{display:block; font-size:9.5px; font-weight:800; color:var(--secondary); text-transform:uppercase; letter-spacing:.06em; margin-top:4px}

.sheet-foot{display:flex; justify-content:space-between; gap:10px; align-items:center; border-top:2.5px solid var(--ink); margin-top:4px; padding-top:9px; font-size:10.5px; color:var(--secondary); font-weight:600}
.sheet-foot .brandline{display:flex; align-items:center; gap:6px}
.sheet-foot img{height:13px; width:auto; opacity:.9}

.empty-card{max-width:560px; margin:60px auto; text-align:center; background:#fff; border:1px solid var(--border); border-radius:22px; padding:50px 36px; box-shadow:var(--shadow-md)}

@media print{
  body{background:#fff}
  .no-print{display:none !important}
  .sheet-shell{padding:0; max-width:none}
  .paper{border:0; box-shadow:none; border-radius:0}
  .sheet{max-width:none; padding:0}
  .magnet{display:none}
  @page{size:letter portrait; margin:0.45in}
}
</style>
</head>
<body>

<div class="nav-wrap no-print">
  <nav class="navbar py-2 container container-narrow">
    <a class="brand-lockup" href="index.html">
      <img src="assets/logo.svg" alt="SupportNow" class="brand-logo">
      <span class="vertical-tag">Emergency<br>Contact</span>
    </a>
    <span class="score-chip"><span class="ring" id="chipRing">0</span> Kids Safety Score <small id="chipBand"></small></span>
  </nav>
</div>

<div class="sheet-shell">
  <div class="toolbar no-print" id="toolbar">
    <div>
      <span class="eyebrow"><i class="fa-solid fa-print"></i> Step 3 of 3</span>
      <h1 style="font-size:1.5rem; margin:4px 0 2px">Your Fridge Sheet</h1>
      <div class="tip">Paper shows what a caregiver needs at a glance. Each QR opens that kid's full, current page, so updates online never require a reprint.</div>
    </div>
    <div class="d-flex gap-2 flex-wrap">
      <a class="btn btn-ghost" href="builder.html"><i class="fa-solid fa-pen me-2"></i>Edit info</a>
      <button class="btn btn-brand" onclick="window.print()"><i class="fa-solid fa-print me-2"></i>Print it</button>
    </div>
  </div>

  <div id="sheetMount"></div>
</div>

<script src="assets/qrcode.min.js"></script>
<script src="assets/ec.js"></script>
<script>
if (new URLSearchParams(location.search).has('demo')) EC.seedDemo();
let state = EC.load();

function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
function trunc(s, n) { s = s || ''; return s.length > n ? s.slice(0, n - 1) + '…' : s; }

const score = EC.score(state);
const band = EC.band(score);
document.getElementById('chipRing').textContent = score;
document.getElementById('chipRing').style.background = band.color;
document.getElementById('chipBand').textContent = band.label;

const kids = state.kids.filter(function (k) { return k.name; });
const mount = document.getElementById('sheetMount');

if (!kids.length) {
  document.getElementById('toolbar').style.display = 'none';
  mount.innerHTML =
    '<div class="empty-card">' +
      '<div class="icon-tile" style="margin:0 auto 18px"><i class="fa-solid fa-file-circle-plus"></i></div>' +
      '<h2 style="font-size:1.4rem">Nothing to print yet</h2>' +
      '<p style="color:var(--secondary); font-size:15px">Your fridge sheet builds itself from your Emergency Card. Add at least one kid and it appears here.</p>' +
      '<div class="d-flex gap-2 justify-content-center flex-wrap mt-4">' +
        '<a class="btn btn-brand" href="builder.html"><i class="fa-solid fa-pen me-2"></i>Build your card</a>' +
        '<a class="btn btn-ghost" href="sheet.html?demo=1">Load the demo family</a>' +
      '</div>' +
    '</div>';
} else {
  const f = state.family;
  const famName = f.familyName ? 'The ' + f.familyName + ' Family' : 'Our Family';
  const parents = [];
  if (f.p1name) parents.push({ b: f.p1name, s: 'Parent', n: f.p1phone });
  if (f.p2name) parents.push({ b: f.p2name, s: 'Parent', n: f.p2phone });
  state.contacts.filter(function (c) { return c.name && c.phone; }).slice(0, 2).forEach(function (c) {
    parents.push({ b: c.name, s: c.rel || 'Backup adult', n: c.phone });
  });

  mount.innerHTML =
    '<div class="paper sheet">' +
      '<div class="magnet no-print"></div>' +
      '<div class="sheet-head">' +
        '<div class="sheet-title"><i class="fa-solid fa-heart-pulse"></i> Emergency Contact</div>' +
        '<div class="sheet-fam">' + esc(famName) + '</div>' +
      '</div>' +
      '<div class="call-band">' +
        '<span class="big"><b>Emergency: 911</b></span>' +
        '<span class="big"><b>Poison Control:</b> 1-800-222-1222</span>' +
        (f.address ? '<span><b>Home:</b> ' + esc(f.address) + '</span>' : '') +
        (f.hospital ? '<span><b>Hospital:</b> ' + esc(f.hospital) + '</span>' : '') +
      '</div>' +
      (parents.length ?
        '<div class="grown-ups">' + parents.map(function (p) {
          return '<div class="who"><b>' + esc(p.b) + '</b><span>' + esc(p.s) + '</span><div class="num">' + esc(p.n || '') + '</div></div>';
        }).join('') + '</div>' : '') +
      '<div id="kidRows"></div>' +
      '<div class="sheet-foot">' +
        '<span>Scan a code for that kid\'s full, current page. Updated ' + EC.fmtDate(state.updatedAt) + '.</span>' +
        '<span class="brandline">Emergency Contact by <img src="assets/logo.svg" alt="SupportNow"></span>' +
      '</div>' +
    '</div>';

  const rows = document.getElementById('kidRows');
  kids.forEach(function (k, kidIdx) {
    const i = state.kids.indexOf(k);
    const a = EC.age(k.born);
    const meta = [a !== '' ? 'age ' + a : '', k.born, k.blood && k.blood !== 'Unknown' ? k.blood : ''].filter(Boolean).join(' • ');
    let chips = '';
    if (k.allergies) chips += '<span class="chip chip-allergy"><i class="fa-solid fa-triangle-exclamation"></i>' + esc(k.allergies) + '</span>';
    else if (k.noAllergies) chips += '<span class="chip chip-ok">No known allergies</span>';
    const row = document.createElement('div');
    row.className = 'kid-row';
    row.innerHTML =
      '<div class="kid-name"><b>' + esc(k.name) + '</b><span>' + esc(meta) + '</span></div>' +
      '<div class="kid-facts">' +
        (chips ? '<div class="chips">' + chips + '</div>' : '') +
        (k.meds ? '<div class="line"><span class="lbl">Meds</span>' + esc(trunc(k.meds, 95)) + '</div>' : '') +
        (k.conditions ? '<div class="line"><span class="lbl">Conditions</span>' + esc(trunc(k.conditions, 70)) + '</div>' : '') +
        (k.doctor ? '<div class="line"><span class="lbl">Doctor</span>' + esc(k.doctor) + (k.doctorPhone ? ', ' + esc(k.doctorPhone) : '') + '</div>' : '') +
      '</div>' +
      '<div class="kid-qr"><div class="qr-box" data-qr="' + i + '"></div><small>Scan for details</small></div>';
    rows.appendChild(row);
  });

  document.querySelectorAll('[data-qr]').forEach(function (el) {
    EC.qr(el, EC.childUrl(el.dataset.qr));
  });
}
</script>
</body>
</html>
