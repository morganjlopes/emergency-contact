<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emergency Contact | Child details</title>
<meta name="robots" content="noindex">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<link href="assets/ec.css" rel="stylesheet">

<style>
body{background:#f2f4f8}
.phone-shell{max-width:480px; margin:0 auto; padding:18px 16px 60px}
.sos{
  background:#fff1f2; border:1.5px solid #fecdd3; color:#9f1239; border-radius:14px;
  padding:12px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  font-weight:700; font-size:14px; margin-bottom:14px;
}
.sos a{background:#e11d48; color:#fff; border-radius:50px; padding:8px 18px; font-weight:800; font-size:14px; white-space:nowrap}
.kid-hero{display:flex; align-items:center; gap:14px; padding:6px 4px 16px}
.avatar{
  width:58px; height:58px; border-radius:50%; background:var(--navy); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:800; flex-shrink:0;
}
.kid-hero h1{font-size:1.6rem; margin:0; line-height:1.1}
.kid-hero .meta{font-size:13px; color:var(--secondary); font-weight:600}
.pcard{background:#fff; border:1px solid var(--border); border-radius:18px; padding:18px 18px 8px; margin-bottom:14px; box-shadow:var(--shadow)}
.pcard h2{font-size:12px; text-transform:uppercase; letter-spacing:.09em; color:var(--secondary); margin-bottom:12px; display:flex; align-items:center; gap:8px}
.pcard h2 i{color:var(--brand)}
.pcard.warn{border-color:#fecdd3; background:#fffafb}
.pcard.warn h2 i{color:#e11d48}
.prow{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--border-light)}
.prow:first-of-type{border-top:0}
.prow .l b{display:block; font-size:15px; color:var(--ink)}
.prow .l span{font-size:12.5px; color:var(--secondary)}
.call-btn{
  border:1.5px solid var(--border); color:var(--brand-dark); border-radius:50px; padding:7px 15px;
  font-weight:800; font-size:13.5px; white-space:nowrap; background:#fff;
}
.call-btn i{margin-right:5px}
.fact{padding:9px 0 13px; border-top:1px solid var(--border-light)}
.fact:first-of-type{border-top:0; padding-top:0}
.fact .lbl{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin-bottom:2px}
.fact .val{font-size:15px; color:var(--ink); font-weight:500}
.allergy-big{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px}
.foot-note{text-align:center; font-size:12px; color:var(--muted); font-weight:600; margin-top:22px}
.foot-note img{height:14px; opacity:.85; vertical-align:-2px}
</style>
</head>
<body>

<div class="phone-shell">
  <div class="d-flex align-items-center justify-content-between py-2 mb-1">
    <span style="font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--secondary)"><i class="fa-solid fa-heart-pulse me-1" style="color:var(--rose)"></i> Emergency Contact</span>
    <span style="font-size:12px; color:var(--muted); font-weight:600" id="famTag"></span>
  </div>

  <div id="mount"></div>

  <div class="foot-note">
    Kept current by the family. This page updates the moment they do.<br>
    Powered by <img src="assets/logo.svg" alt="SupportNow"> &middot; <a href="index.html" style="color:var(--brand); font-weight:700">Make one for your family</a>
  </div>
</div>

<script src="assets/qrcode.min.js"></script>
<script src="assets/ec.js"></script>
<script>
let state = EC.load();
const i = parseInt(new URLSearchParams(location.search).get('i') || '0', 10);
if (new URLSearchParams(location.search).has('demo') && (!state.kids[i] || !state.kids[i].name)) {
  state = EC.seedDemo();
}
const k = state.kids[i];
const mount = document.getElementById('mount');

function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
function tel(n) { return 'tel:' + (n || '').replace(/[^0-9+]/g, ''); }
function fact(lbl, val) { return val ? '<div class="fact"><div class="lbl">' + lbl + '</div><div class="val">' + esc(val) + '</div></div>' : ''; }

if (!k || !k.name) {
  mount.innerHTML =
    '<div class="pcard" style="text-align:center; padding:36px 24px">' +
      '<div class="icon-tile" style="margin:0 auto 16px"><i class="fa-solid fa-qrcode"></i></div>' +
      '<h2 style="all:unset; font-weight:700; font-size:1.15rem; color:var(--ink); display:block; margin-bottom:8px">This QR would open a child\'s page</h2>' +
      '<p style="font-size:14px; color:var(--secondary)">In the real product this link is private and always current. On this device there is no Emergency Card yet.</p>' +
      '<a class="btn btn-brand btn-sm-x mt-2" href="child.html?i=0&demo=1" onclick="EC.seedDemo()">Show me with the demo family</a>' +
    '</div>';
} else {
  const f = state.family, c = state.care;
  document.getElementById('famTag').textContent = f.familyName ? 'The ' + f.familyName + ' Family' : '';
  const meta = [EC.age(k.born) !== '' ? 'Age ' + EC.age(k.born) : '', k.born ? 'born ' + k.born : '', k.blood && k.blood !== 'Unknown' ? 'Blood type ' + k.blood : ''].filter(Boolean).join(' • ');

  const people = [];
  if (f.p1name) people.push({ name: f.p1name, rel: 'Parent', phone: f.p1phone });
  if (f.p2name) people.push({ name: f.p2name, rel: 'Parent', phone: f.p2phone });
  state.contacts.filter(function (x) { return x.name; }).forEach(function (x) {
    people.push({ name: x.name, rel: x.rel || 'Emergency contact', phone: x.phone });
  });

  let html =
    '<div class="sos"><span><i class="fa-solid fa-circle-exclamation me-1"></i> Real emergency? Call 911 first.</span><a href="tel:911">Call 911</a></div>' +
    '<div class="kid-hero">' +
      '<div class="avatar">' + esc(k.name[0].toUpperCase()) + '</div>' +
      '<div><h1>' + esc(k.name) + '</h1><div class="meta">' + esc(meta) + '</div></div>' +
    '</div>';

  html += '<div class="pcard"><h2><i class="fa-solid fa-phone"></i> Call first</h2>' +
    people.map(function (p) {
      return '<div class="prow"><div class="l"><b>' + esc(p.name) + '</b><span>' + esc(p.rel) + '</span></div>' +
        (p.phone ? '<a class="call-btn" href="' + tel(p.phone) + '"><i class="fa-solid fa-phone"></i>' + esc(p.phone) + '</a>' : '') + '</div>';
    }).join('') + '</div>';

  if (k.allergies || k.noAllergies) {
    html += '<div class="pcard' + (k.allergies ? ' warn' : '') + '"><h2><i class="fa-solid fa-triangle-exclamation"></i> Allergies</h2>' +
      '<div class="allergy-big">' +
        (k.allergies
          ? k.allergies.split(',').map(function (a) { return '<span class="chip chip-allergy" style="font-size:14px; padding:6px 12px"><i class="fa-solid fa-triangle-exclamation"></i>' + esc(a.trim()) + '</span>'; }).join('')
          : '<span class="chip chip-ok" style="font-size:14px; padding:6px 12px">No known allergies</span>') +
      '</div>' +
      fact('If a reaction happens', k.reactions) + '</div>';
  }

  if (k.meds || k.conditions) {
    html += '<div class="pcard"><h2><i class="fa-solid fa-pills"></i> Meds and conditions</h2>' +
      fact('Medications and doses', k.meds) +
      fact('Conditions', k.conditions) + '</div>';
  }

  html += '<div class="pcard"><h2><i class="fa-solid fa-user-doctor"></i> Care team</h2>' +
    (k.doctor ? '<div class="prow"><div class="l"><b>' + esc(k.doctor) + '</b><span>Pediatrician</span></div>' +
      (k.doctorPhone ? '<a class="call-btn" href="' + tel(k.doctorPhone) + '"><i class="fa-solid fa-phone"></i>Call</a>' : '') + '</div>' : '') +
    fact('Dentist', k.dentist) +
    fact('Preferred hospital', f.hospital) +
    fact('Insurance', [f.insProvider, f.insId ? 'Member ID ' + f.insId : ''].filter(Boolean).join(' • ')) +
    '</div>';

  const good = [fact('Where emergency supplies live', c.firstAid), fact('Approved pickup list', c.pickup), fact('About ' + k.name, k.notes), fact('House notes', c.notes)].join('');
  if (good) html += '<div class="pcard"><h2><i class="fa-solid fa-lightbulb"></i> Good to know</h2>' + good + '</div>';

  html += '<div class="text-center mt-3" style="font-size:12px; color:var(--muted); font-weight:600">Updated ' + EC.fmtDate(state.updatedAt) + '</div>';
  mount.innerHTML = html;
}

</script>
</body>
</html>
