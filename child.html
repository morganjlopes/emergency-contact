<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emergency Contact | Child details</title>
<meta name="robots" content="noindex">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<link href="assets/ec.css" rel="stylesheet">

<style>
body{background:#eef1f6}
.phone{max-width:480px; margin:0 auto; padding:16px 15px 60px}

.sos{
  background:var(--rose-tint); border:1.5px solid var(--rose-border); border-radius:14px;
  padding:11px 13px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  margin-bottom:13px;
}
.sos span{font-weight:800; font-size:14px; color:var(--rose-dark)}
.sos a{background:var(--rose); color:#fff; border-radius:50px; padding:8px 20px; font-weight:800; font-size:14px; white-space:nowrap}

.hero-card{background:#fff; border:1px solid var(--border); border-radius:18px; padding:20px 18px; box-shadow:var(--shadow); margin-bottom:13px}
.hero-card h1{font-size:1.5rem; margin:0 0 3px}
.hero-card .sub{font-size:13.5px; color:var(--secondary); font-weight:600}

.callrow{display:flex; gap:9px; margin-top:15px}
.callrow a{
  flex:1; background:var(--brand-bg); border:1.5px solid #cfe6fb; border-radius:12px;
  padding:10px 8px; text-align:center; font-weight:700; font-size:13.5px; color:var(--brand-dark); line-height:1.3;
}
.callrow a small{display:block; font-weight:600; font-size:11px; color:var(--secondary); margin-top:1px}
.callrow a:hover{background:#dcedfd}

.block{background:#fff; border:1px solid var(--border); border-radius:18px; padding:18px; box-shadow:var(--shadow); margin-bottom:13px}
.block h2{
  font-size:11px; font-weight:800; letter-spacing:.09em; text-transform:uppercase;
  color:var(--secondary); margin:0 0 11px; display:flex; align-items:center; gap:7px;
}
.block h2 i{font-size:12px}
.block.alert-block{border-color:var(--rose-border); background:var(--rose-tint)}
.block.alert-block h2{color:var(--rose-dark)}

.med{background:#eef2ff; border:1px solid #c7d2fe; border-radius:12px; padding:11px 13px; margin-bottom:9px}
.med:last-child{margin-bottom:0}
.med b{color:var(--navy); font-weight:800; font-size:14px}
.med p{margin:2px 0 0; font-size:13px; color:var(--body); line-height:1.5}

.kv{display:flex; justify-content:space-between; gap:14px; padding:8px 0; border-bottom:1px solid var(--border-light); font-size:14px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--secondary); font-weight:600; flex-shrink:0}
.kv .v{color:var(--ink); font-weight:600; text-align:right}
.kv .v a{color:var(--brand); font-weight:700}

.person{display:flex; align-items:center; gap:11px; padding:9px 0; border-bottom:1px solid var(--border-light)}
.person:last-child{border-bottom:0}
.person .av{
  width:36px; height:36px; border-radius:50%; background:var(--brand-bg); color:var(--brand-dark);
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; flex-shrink:0;
}
.person .who{flex:1; min-width:0}
.person .who b{display:block; font-size:14.5px; color:var(--ink)}
.person .who span{font-size:12.5px; color:var(--secondary)}
.person .tel{color:var(--brand); font-weight:700; font-size:14px; white-space:nowrap}

.note{font-size:13.5px; color:var(--body); line-height:1.6; margin:0}
.stamp{text-align:center; font-size:12px; color:var(--muted); font-weight:600; padding:8px 0 0}
.stamp img{height:19px; opacity:.65; display:block; margin:6px auto 0}
.switcher{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:13px}
.switcher a{
  background:#fff; border:1.5px solid var(--border); border-radius:50px; padding:6px 15px;
  font-size:13px; font-weight:700; color:var(--secondary);
}
.switcher a.on{background:var(--brand); border-color:var(--brand); color:#fff}
</style>
</head>
<body>

<div class="phone">
  <div id="view"></div>
</div>

<script src="assets/ec.js"></script>
<script>
(function () {
  var state = EC.load();
  if (!state.children.length) state = EC.sample();

  function param(name) {
    var m = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
    return m ? decodeURIComponent(m[1]) : null;
  }

  var code = param('c');
  var child = state.children.filter(function (c) {
    return (c.code || EC.makeCode(c.id)) === code;
  })[0] || state.children[0];

  var view = document.getElementById('view');

  if (!child) {
    view.innerHTML = '<div class="block"><h2><i class="fa-solid fa-circle-question"></i> Not found</h2>' +
      '<p class="note">This code does not match a child on file. Ask the family for a current sheet.</p></div>';
    return;
  }

  var age = EC.age(child.dob);
  var initials = child.name.split(' ').map(function (w) { return w[0]; }).slice(0, 2).join('').toUpperCase();
  var tel = function (n) { return 'tel:' + String(n).replace(/[^0-9+]/g, ''); };

  var html = '';

  /* Other kids on the same sheet, so a sitter is never stuck on one child */
  if (state.children.length > 1) {
    html += '<div class="switcher">' + state.children.map(function (c) {
      var cd = c.code || EC.makeCode(c.id);
      return '<a href="child.html?c=' + encodeURIComponent(cd) + '"' +
        (c === child ? ' class="on"' : '') + '>' + EC.esc(c.name.split(' ')[0]) + '</a>';
    }).join('') + '</div>';
  }

  html += '<div class="sos"><span><i class="fa-solid fa-triangle-exclamation me-1"></i> Life threatening? Call 911 first.</span>' +
    '<a href="tel:911">911</a></div>';

  /* Identity and the two fastest numbers */
  html += '<div class="hero-card">' +
    '<h1>' + EC.esc(child.name) + '</h1>' +
    '<div class="sub">' + (age != null ? 'Age ' + age : '') +
      (child.school ? (age != null ? ' · ' : '') + EC.esc(child.school) : '') + '</div>';

  var callable = state.parents.filter(function (p) { return p.name && p.phone; });
  if (callable.length) {
    html += '<div class="callrow">' + callable.map(function (p) {
      return '<a href="' + tel(p.phone) + '"><i class="fa-solid fa-phone me-1"></i> ' +
        EC.esc(p.relation || p.name.split(' ')[0]) + '<small>' + EC.esc(p.phone) + '</small></a>';
    }).join('') + '</div>';
  }
  html += '</div>';

  /* Allergies lead, because that is what someone scans this for */
  var hasAllergies = child.allergies && child.allergies.length;
  html += '<div class="block' + (hasAllergies ? ' alert-block' : '') + '">' +
    '<h2><i class="fa-solid fa-triangle-exclamation"></i> Allergies</h2>' +
    (hasAllergies
      ? '<div class="d-flex flex-wrap gap-2">' + child.allergies.map(function (a) {
          return '<span class="chip chip-allergy">' + EC.esc(a) + '</span>';
        }).join('') + '</div>'
      : '<p class="note">No known allergies.</p>') +
    '</div>';

  var meds = (child.meds || []).filter(function (m) { return m.name; });
  if (meds.length) {
    html += '<div class="block"><h2><i class="fa-solid fa-pills"></i> Medication</h2>' +
      meds.map(function (m) {
        return '<div class="med"><b>' + EC.esc(m.name) + (m.dose ? ', ' + EC.esc(m.dose) : '') + '</b>' +
          (m.when ? '<p>' + EC.esc(m.when) + '</p>' : '') + '</div>';
      }).join('') + '</div>';
  }

  if (child.conditions) {
    html += '<div class="block"><h2><i class="fa-solid fa-notes-medical"></i> Good to know</h2>' +
      '<p class="note">' + EC.esc(child.conditions) + '</p></div>';
  }

  /* Doctor and insurance */
  var m = state.medical, rows = '';
  if (m.pediatrician.name) {
    rows += '<div class="kv"><span class="k">Pediatrician</span><span class="v">' + EC.esc(m.pediatrician.name) +
      (m.pediatrician.phone ? '<br><a href="' + tel(m.pediatrician.phone) + '">' + EC.esc(m.pediatrician.phone) + '</a>' : '') +
      '</span></div>';
  }
  if (m.insurance.carrier) {
    rows += '<div class="kv"><span class="k">Insurance</span><span class="v">' + EC.esc(m.insurance.carrier) +
      (m.insurance.memberId ? '<br>' + EC.esc(m.insurance.memberId) : '') + '</span></div>';
  }
  if (m.urgentCare) rows += '<div class="kv"><span class="k">Urgent care</span><span class="v">' + EC.esc(m.urgentCare) + '</span></div>';
  if (m.hospital) rows += '<div class="kv"><span class="k">Hospital</span><span class="v">' + EC.esc(m.hospital) + '</span></div>';
  if (m.consent) rows += '<div class="kv"><span class="k">Consent form</span><span class="v">Signed and on file</span></div>';
  if (rows) html += '<div class="block"><h2><i class="fa-solid fa-stethoscope"></i> Doctor and insurance</h2>' + rows + '</div>';

  /* Trusted adults */
  var adults = state.contacts.filter(function (c) { return c.name && c.phone; });
  if (adults.length) {
    html += '<div class="block"><h2><i class="fa-solid fa-user-group"></i> If you cannot reach a parent</h2>' +
      adults.map(function (c) {
        var av = c.name.split(' ').map(function (w) { return w[0]; }).slice(0, 2).join('').toUpperCase();
        var tags = [c.relation, c.pickup ? 'Cleared for pickup' : null].filter(Boolean).join(' · ');
        return '<div class="person"><span class="av">' + EC.esc(av) + '</span>' +
          '<span class="who"><b>' + EC.esc(c.name) + '</b><span>' + EC.esc(tags) + '</span></span>' +
          '<a class="tel" href="' + tel(c.phone) + '">' + EC.esc(c.phone) + '</a></div>';
      }).join('') + '</div>';
  }

  /* Routine last. It matters at bedtime, not in a crisis. */
  if (child.routine || child.comfort) {
    html += '<div class="block"><h2><i class="fa-solid fa-moon"></i> Routine</h2>';
    if (child.routine) html += '<p class="note mb-2">' + EC.esc(child.routine) + '</p>';
    if (child.comfort) html += '<p class="note"><b>Comfort:</b> ' + EC.esc(child.comfort) + '</p>';
    html += '</div>';
  }

  if (state.family.address || state.family.notes) {
    html += '<div class="block"><h2><i class="fa-solid fa-house"></i> Home</h2>' +
      (state.family.address
        ? '<div class="kv"><span class="k">Address</span><span class="v">' + EC.esc(state.family.address) +
          (state.family.city ? '<br>' + EC.esc(state.family.city) : '') + '</span></div>'
        : '') +
      (state.family.notes ? '<p class="note mt-2">' + EC.esc(state.family.notes) + '</p>' : '') +
      '</div>';
  }

  html += '<div class="stamp">Updated ' + EC.esc(EC.fmtDate(state.updatedAt) || EC.fmtDate(new Date().toISOString())) +
    '<img src="logo.svg" alt="SupportNow"></div>';

  view.innerHTML = html;
  document.title = child.name + ' | Emergency Contact';
})();
</script>
</body>
</html>
